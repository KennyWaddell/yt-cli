name: Build Windows Portable (YT-CLI)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Compilar YT-CLI.exe y Empaquetar Windows Portable
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.8 (Compatibilidad Universal Win 7/8.1/10/11)
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Instalar PyInstaller
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Descargar binarios portables oficiales (mpv, ffmpeg, yt-dlp)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path windows\bin
          
          Write-Host "-> Descargando yt-dlp.exe oficial..."
          curl.exe -fSL "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -o "windows\bin\yt-dlp.exe"

          Write-Host "-> Descargando ffmpeg.exe y ffprobe.exe oficiales (gyan.dev essentials)..."
          curl.exe -fSL "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -o "ffmpeg.zip"
          7z e ffmpeg.zip -owindows\bin ffmpeg.exe ffprobe.exe -r -y
          Remove-Item ffmpeg.zip -Force

          Write-Host "-> Descargando vulkan-1.dll oficial (LunarG VulkanRT)..."
          curl.exe -fSL -A "Mozilla/5.0" "https://sdk.lunarg.com/sdk/download/1.3.296.0/windows/VulkanRT-1.3.296.0-Components.zip" -o "vulkan.zip"
          7z e vulkan.zip -owindows\bin VulkanRT-1.3.296.0-Components\x64\vulkan-1.dll -r -y
          Remove-Item vulkan.zip -Force

          Write-Host "-> Descargando mpv.exe oficial (shinchiro winbuild)..."
          curl.exe -fSL "https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261111/mpv-x86_64-20261111-git-bcde6b93cc.7z" -o "mpv.7z"
          7z e mpv.7z -owindows\bin mpv.exe mpv.com *.dll -r -y
          Remove-Item mpv.7z -Force

      - name: Compilar YT-CLI.exe con PyInstaller
        working-directory: windows
        shell: cmd
        run: |
          pyinstaller --noconsole --onefile --icon=app.ico --add-data "app.ico;." --name=YT-CLI yt_cli_gui.py

      - name: Smoke-Test de Integridad y Muxing en Windows VM
        shell: powershell
        run: |
          Write-Host "=== TEST 1: Verificando ejecucion de yt-dlp.exe ==="
          & windows\bin\yt-dlp.exe --version
          if ($LASTEXITCODE -ne 0) { throw "yt-dlp.exe fallo al ejecutar" }

          Write-Host "=== TEST 2: Verificando ejecucion de ffmpeg.exe (Gyan Essentials) ==="
          & windows\bin\ffmpeg.exe -version
          if ($LASTEXITCODE -ne 0) { throw "ffmpeg.exe fallo al ejecutar" }

          Write-Host "=== TEST 3: Verificando ejecucion de ffprobe.exe ==="
          & windows\bin\ffprobe.exe -version
          if ($LASTEXITCODE -ne 0) { throw "ffprobe.exe fallo al ejecutar" }

          Write-Host "=== TEST 4: Verificando mpv.exe con vulkan-1.dll y d3dcompiler ==="
          & windows\bin\mpv.exe --version
          if ($LASTEXITCODE -ne 0) { throw "mpv.exe fallo al ejecutar" }

          Write-Host "=== TEST 5: Verificando deteccion de ffmpeg en yt-dlp ==="
          & windows\bin\yt-dlp.exe --ffmpeg-location windows\bin --version
          if ($LASTEXITCODE -ne 0) { throw "yt-dlp no pudo enlazar con ffmpeg" }

          Write-Host "=== TEST 6: Prueba real de muxing de video + audio con FFmpeg ==="
          & windows\bin\ffmpeg.exe -f lavfi -i color=c=blue:s=320x240:d=1 -c:v libx264 test_v.mp4 -y
          & windows\bin\ffmpeg.exe -f lavfi -i sine=f=440:d=1 -c:a aac test_a.m4a -y
          & windows\bin\ffmpeg.exe -i test_v.mp4 -i test_a.m4a -c copy test_merged.mp4 -y
          if (!(Test-Path test_merged.mp4)) { throw "Fallo la creacion y fusion del contenedor MP4" }
          $streams = & windows\bin\ffprobe.exe -v error -show_entries stream=codec_type -of csv=p=0 test_merged.mp4
          if (($streams -join ",") -notmatch "video" -or ($streams -join ",") -notmatch "audio") { throw "El MP4 fusionado no contiene ambas pistas" }

          Write-Host "=== TEST 7: Prueba real de conversion a MP3 verificada con ffprobe ==="
          & windows\bin\ffmpeg.exe -i test_merged.mp4 -vn -c:a libmp3lame -b:a 320k test_audio.mp3 -y
          if (!(Test-Path test_audio.mp3)) { throw "Fallo la conversion a MP3" }
          $mp3codec = & windows\bin\ffprobe.exe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 test_audio.mp3
          if ($mp3codec.Trim() -ne "mp3") { throw "El archivo MP3 generado no es valido: $mp3codec" }
          Remove-Item test_v.mp4, test_a.m4a, test_merged.mp4, test_audio.mp3 -Force

          Write-Host "=== [EXITO] TODOS LOS TESTS ENTORNO WINDOWS PASARON AL 100% ==="

      - name: Empaquetar ZIP Portable
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist-package\bin
          Copy-Item windows\dist\YT-CLI.exe dist-package\
          Copy-Item windows\README.txt dist-package\
          Copy-Item windows\bin\*.exe dist-package\bin\
          if (Test-Path windows\bin\*.dll) {
            Copy-Item windows\bin\*.dll dist-package\bin\
          }
          Compress-Archive -Path dist-package\* -DestinationPath YT-CLI-Windows-Portable.zip -Force
          $hash = (Get-FileHash -Path YT-CLI-Windows-Portable.zip -Algorithm SHA256).Hash
          "YT-CLI-Windows-Portable.zip SHA256: $hash" | Out-File -Encoding utf8 SHA256.txt
          Get-Content SHA256.txt

      - name: Subir artefacto para descarga directa
        uses: actions/upload-artifact@v4
        with:
          name: YT-CLI-Windows-Portable
          path: |
            YT-CLI-Windows-Portable.zip
            SHA256.txt

      - name: Publicar en Release de GitHub (si es una version tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "YT-CLI ${{ github.ref_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            YT-CLI-Windows-Portable.zip
            SHA256.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
